<svg id="source-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
                <defs>
                  <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="130%">
                    <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.6"/>
                    <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
                  </filter>
                  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#111827"/>
                    <stop offset="60%" stop-color="#0b0f19"/>
                    <stop offset="100%" stop-color="#05070d"/>
                  </linearGradient>
                  <linearGradient id="disk-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#243048"/>
                    <stop offset="100%" stop-color="#121826"/>
                  </linearGradient>
                  <linearGradient id="metal-shutter" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#64748b"/>
                    <stop offset="35%" stop-color="#e2e8f0"/>
                    <stop offset="70%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#94a3b8"/>
                  </linearGradient>
                  <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
                    <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02"/>
                    <stop offset="36%" stop-color="#ffffff" stop-opacity="0"/>
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                  </linearGradient>
                  <clipPath id="squircle-clip">
                    <rect x="32" y="32" width="448" height="448" rx="104" ry="104"/>
                  </clipPath>
                </defs>
                <g filter="url(#tile-shadow)">
                  <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-grad)"/>
                  <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" ry="103.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
                </g>
                <g clip-path="url(#squircle-clip)">
                  <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
                    <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
                  </radialGradient>
                  <circle cx="256" cy="256" r="200" fill="url(#center-glow)"/>
                  <g id="save-disk-base">
                    <path d="M 146 100 L 358 100 L 392 134 L 392 376 A 24 24 0 0 1 368 400 L 144 400 A 24 24 0 0 1 120 376 L 120 126 A 26 26 0 0 1 146 100 Z" fill="url(#disk-body-grad)" stroke="#334155" stroke-width="1.5"/>
                    <path d="M 148 102 L 356 102" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>
                  </g>
                  <g id="disk-shutter">
                    <rect x="174" y="100" width="164" height="92" rx="8" fill="url(#metal-shutter)"/>
                    <rect x="216" y="116" width="38" height="60" rx="5" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
                    <rect x="228" y="122" width="14" height="48" rx="2" fill="#38bdf8" fill-opacity="0.4"/>
                    <line x1="184" y1="100" x2="184" y2="192" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
                  </g>
                  <g id="disk-label">
                    <rect x="150" y="214" width="212" height="166" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
                    <path d="M 150 228 A 14 14 0 0 1 164 214 L 348 214 A 14 14 0 0 1 362 228 L 362 246 L 150 246 Z" fill="#0284c7"/>
                    <rect x="150" y="244" width="212" height="3" fill="#38bdf8"/>
                    <rect x="174" y="272" width="164" height="5" rx="2.5" fill="#cbd5e1"/>
                    <rect x="174" y="296" width="164" height="5" rx="2.5" fill="#cbd5e1"/>
                    <rect x="174" y="320" width="110" height="5" rx="2.5" fill="#cbd5e1"/>
                  </g>
                  <path d="M 32 32 L 340 32 L 60 480 L 32 480 Z" fill="url(#glass-glare)" pointer-events="none"/>
                </g>
              </svg>