<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft App Tile Drop Shadow -->
    <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Floating Badge Shadow -->
    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.65" />
    </filter>

    <!-- Vibrant Controller Bloom Glow -->
    <filter id="glow-cyan" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- App Squircle Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>

    <!-- Floppy Disk Body Gradient -->
    <linearGradient id="disk-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243048" />
      <stop offset="100%" stop-color="#121826" />
    </linearGradient>

    <!-- Clean Satin Metal Shutter -->
    <linearGradient id="metal-shutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Hero Gamepad Gradient -->
    <linearGradient id="gamepad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sync Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Diagonal Glare Sheen -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="36%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Squircle Clip Path -->
    <clipPath id="squircle-clip">
      <rect x="32" y="32" width="448" height="448" rx="104" ry="104" />
    </clipPath>
  </defs>

  <!-- Layer 1: Base App Tile Container -->
  <g filter="url(#tile-shadow)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-grad)" />
    <!-- Fine Specular Border -->
    <rect x="32.5" y="32.5" width="447" height="447" rx="103.5" ry="103.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- Layer 2: Contained Foreground Artwork -->
  <g clip-path="url(#squircle-clip)">
    <!-- Soft Center Ambient Backlight -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <circle cx="256" cy="256" r="200" fill="url(#center-glow)" />

    <!-- Floppy Disk (Save Symbolism) -->
    <g id="save-disk-base">
      <!-- Main Disk Chassis with Top-Right Chamfer -->
      <path d="M 146 100 
               L 358 100 
               L 392 134 
               L 392 376 
               A 24 24 0 0 1 368 400 
               L 144 400 
               A 24 24 0 0 1 120 376 
               L 120 126 
               A 26 26 0 0 1 146 100 
               Z" 
            fill="url(#disk-body-grad)" 
            stroke="#334155" 
            stroke-width="1.5" />

      <!-- Top Edge Light Reflection -->
      <path d="M 148 102 L 356 102" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- Floppy Metal Shutter (Top) -->
    <g id="disk-shutter">
      <rect x="174" y="100" width="164" height="92" rx="8" fill="url(#metal-shutter)" />
      
      <!-- Shutter Interior Window -->
      <rect x="216" y="116" width="38" height="60" rx="5" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      
      <!-- Contact Pin Accent Inside Window -->
      <rect x="228" y="122" width="14" height="48" rx="2" fill="#38bdf8" fill-opacity="0.4" />
      
      <!-- Shutter Texture Crease -->
      <line x1="184" y1="100" x2="184" y2="192" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1" />
    </g>

    <!-- Center Display Label Well -->
    <rect x="144" y="216" width="224" height="156" rx="18" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

    <!-- Minimalist Gamepad Emblem (Gaming Symbolism) -->
    <g id="gamepad-glyph" filter="url(#glow-cyan)">
      <!-- Smooth Controller Silhouette -->
      <path d="M 204 252 
               C 220 252, 236 260, 256 260 
               C 276 260, 292 252, 308 252 
               C 334 252, 348 270, 348 296 
               C 348 318, 334 336, 316 336 
               C 300 336, 292 322, 280 316 
               C 270 310, 264 310, 256 310 
               C 248 310, 242 310, 232 316 
               C 220 322, 212 336, 196 336 
               C 178 336, 164 318, 164 296 
               C 164 270, 178 252, 204 252 
               Z" 
            fill="url(#gamepad-grad)" />

      <!-- Minimalist D-Pad (Left Hand) -->
      <path d="M 197 280 L 203 280 L 203 287 L 210 287 L 210 293 L 203 293 L 203 300 L 197 300 L 197 293 L 190 293 L 190 287 L 197 287 Z" 
            fill="#e0f2fe" />

      <!-- 4 Action Buttons in Diamond Formation (Right Hand) -->
      <circle cx="309" cy="279" r="3.2" fill="#e0f2fe" />
      <circle cx="317" cy="290" r="3.2" fill="#e0f2fe" />
      <circle cx="309" cy="301" r="3.2" fill="#e0f2fe" />
      <circle cx="301" cy="290" r="3.2" fill="#e0f2fe" />

      <!-- Center Status Dot -->
      <circle cx="256" cy="285" r="2.5" fill="#e0f2fe" opacity="0.8" />
    </g>

    <!-- Layer 3: Save File Manager Sync Badge (Manager Symbolism) -->
    <g id="manager-badge" transform="translate(370, 372)" filter="url(#badge-shadow)">
      <!-- Outer Accent Ring & Badge Circle -->
      <circle cx="0" cy="0" r="42" fill="#090d16" />
      <circle cx="0" cy="0" r="37" fill="url(#badge-grad)" />

      <!-- Bold Dual Sync / Transfer Arrows -->
      <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Top Clockwise Arc -->
        <path d="M -16 -6 A 18 18 0 0 1 14 -10" />
        <path d="M 8 -16 L 15 -10 L 8 -4" />

        <!-- Bottom Counter-Clockwise Arc -->
        <path d="M 16 6 A 18 18 0 0 1 -14 10" />
        <path d="M -8 16 L -15 10 L -8 4" />
      </g>
    </g>

    <!-- Layer 4: Glass Glare Reflection Sheen -->
    <path d="M 32 32 L 340 32 L 60 480 L 32 480 Z" fill="url(#glass-glare)" pointer-events="none" />
  </g>
</svg>