name: Release APK

# Publishes DungeonWithinSaveManager.apk as a GitHub Release.
# Trigger: push a tag like v1.0, or run it by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install compile SDK packages
        run: |
          : "${ANDROID_SDK_ROOT:?Android SDK not found on runner}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/DungeonWithinSaveManager-debug.apk app/build/outputs/apk/debug/DungeonWithinSaveManager.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/DungeonWithinSaveManager.apk
          generate_release_notes: true
