name: Build APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install compile SDK packages
        # ubuntu runners ship an SDK with cmdline-tools preinstalled, but
        # sdkmanager is not on PATH (setup-android used to put it there).
        # android-actions/setup-android itself is avoided: v3 requests the
        # long-removed "tools" package and fails the whole job.
        run: |
          : "${ANDROID_SDK_ROOT:?Android SDK not found on runner}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/DungeonWithinSaveManager-debug.apk app/build/outputs/apk/debug/DungeonWithinSaveManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DungeonWithinSaveManager-apk
          path: android/app/build/outputs/apk/debug/DungeonWithinSaveManager.apk
